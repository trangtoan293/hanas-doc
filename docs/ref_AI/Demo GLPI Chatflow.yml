  - description: ''
    id: e5a1e91b-3fa9-4ef7-9a64-df684c07e097
    name: update_item_fieldnames
    selector:
    - conversation
    - update_item_fieldnames
    value: 'Some common fields useful for `update_item` tool calling:

      **A. Update a Ticket**

      - "name": ticket title (or heading)

      - "content": ticket description (or content)

      **B. Update a TicketTask**

      - "content": task description (or content)

      - "state": task status (0 for "Information", 1 for "ToDo", 2 for "Done")

      - "end": task deadline (format "%Y-%m-%d %H:%M:%S")

      - "users_id_tech": the id of the person who is assigned to the task

      - "groups_id_tech": the id of the group who is assigned to the task

      **C. Update a TicketValidation**

      - "status": validation status (2 for "Waiting for approval", 3 for "Granted",
      4 for "Refused")

      - "comment_submission": the comment of validation request

      - "users_id_validate": the id of the person who is assigned to validate

      - "comment_validation": the comment of the validator

      - "validation_date": the date of validation approved/ refused

      **D. Update an ITILSolution**

      - "users_id_approval": the id of the person who is assigned to validate the
      solution

      - "content": the solution description (or content)'
    value_type: string
  - description: ''
    id: a2fb2eb0-d8f0-4ce5-a993-dfa514fea5b6
    name: search_items_advanced_fieldids
    selector:
    - conversation
    - search_items_advanced_fieldids
    value: 'Some common field_id useful for `search_items_advanced` tool calling:

      All the datetime fields are in format "%Y-%m-%d %H:%M:%S"

      **A. Related to Ticket Status**

      - field 2: Ticket ID

      - field 1: Ticket Title

      - field 21: Ticket Description

      - field 7: Ticket Category

      - field 14: Ticket Type (value 1 for "Incident" and value 2 for "Request")

      - field 3: Ticket Priority (value 1-6 for Very Low, Low, Medium, High, Very
      High, Major)

      - field 12: Ticket Status (1 for "New", 2 for "Processing (Assigned)", 3 for
      "Processing (Planned)", 4 for "Pending", 5 for "Solved", 6 for "Closed")

      - field 52: Ticket Overall approval status (2 for "Waiting for Approval", 3
      for "Granted", 4 for "Refused")

      **B. Related to Ticket Time**

      - field 15: Ticket Opening date

      - field 16: Ticket Closing date

      - field 17: Ticket Resolution date

      - field 18: Ticket Time to resolve (deadline)

      - field 82: Flag checks whether Ticket is overdue or not (1 is "yes", 0 is "no")

      **C. Related to Personnel in Charge**

      - field 4: Requester, the person who creates the ticket

      - field 71: Requester Group, the group who creates the ticket

      - field 5: Assigner, the person whom the ticket is assigned to

      - field 8: Assigner Group, the group whom the ticket is assigned to

      - field 66: Observer, the person who tracks the ticket progress

      - field 65: Observer Group, the group who tracks the ticket progress

      **C. Related to Ticket Followup (Comment)**

      - field 25: Followup Content

      **D. Related to Tasks attached in Ticket**

      - field 28: Number of Tasks in the ticket

      - field 20: Task Category

      - field 26: Task Description

      - field 33: Task Status (0 for "Information", 1 for "ToDo", 2 for "Done")

      - field 173: Task Begin date

      - field 174: Task End date (deadline)

      - field 95: Technician in charge, the person whom the task is assigned to

      - field 112: Group in charge, the group whom the task is assigned to

      **E. Related to Validation attached in Ticket**

      - field 58: Requester, the person who create request validation

      - field 53: Request Comment, the content of ticket validation

      - field 56: Request Date

      - field 55: Approval Status (2 for "Waiting for approval", 3 for "Granted",
      4 for "Refused")

      - field 59: Approver, the person who approve or refuse the validation

      - field 54: Approval Comment, the content that approver reply to the validation

      - field 57: Approval Date

      **F. Related to Solution of Ticket**

      - field 38: Solution Status of any solution in the ticket (2 for "Waiting for
      approval", 3 for "Accepted", 4 for "Refused")

      - field 24: Solution Content

      - field 74: Solution Creation date'
    value_type: string
