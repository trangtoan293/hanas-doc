          \            urgency = metadata.get(\"urgency\", \"Thường\")\n         \
          \   document_type = metadata.get(\"document_type\", \"Không xác định\")\n\
          \            related_units = metadata.get(\"related_units\", \"Không xác\
          \ định\")\n            additional_notes = metadata.get(\"additional_notes\"\
          , \"Không có\")\n            document_id_glpi = metadata.get(\"document_id_glpi\"\
          , \"-1\")\n            creation_date = metadata.get(\"creation_date\", \"\
          Không xác định\")\n            replaces_docs = metadata.get(\"replaces_docs\"\
          , \"Không có\")\n            approval_comments = metadata.get(\"approval_comments\"\
          , \"Không có\")\n\n            final = f\"**Metadata**\\n\" \\\n       \
          \             f\"- File: {filename}\\n\" \\\n                    f\"- Title:\
          \ {document_title}\\n\" \\\n                    f\"- Code: {document_code}\\\
          n\" \\\n                    f\"- Summary: {summary}\\n\"\\\n           \
          \         f\"- Version: {version}\\n\" \\\n                    f\"- Urgency:\
          \ {urgency}\\n\" \\\n                    f\"- Document Type: {document_type}\\\
          n\" \\\n                    f\"- Related Units: {related_units}\\n\" \\\n\
