              settings: {}
              tool_description: "Create a new ticket in GLPI - ENHANCED with all GLPI\
                \ ticket creation fields.\n\n✨ AGENT-FRIENDLY: This tool now supports\
                \ ALL non-null/non-zero fields from GLPI tickets.\n\nArgs:\n    name:\
                \ Ticket title/subject (required) - e.g., \"TỜ TRÌNH SỐ 27.2025.TT-CNTT\"\
                \n    content: Ticket description/content (required) - detailed description\n\
                \    \n    # \U0001F3AF SIMPLIFIED WORKFLOW FIELDS (most important\
                \ for agents)\n    urgency: How urgent is this? Options: \"low\",\
                \ \"medium\", \"high\", \"critical\" (default: \"medium\")\n     \
                \        Or use numbers: 1=Very Low, 2=Low, 3=Medium, 4=High, 5=Very\
                \ High\n    impact: Business impact if not handled? Options: \"low\"\
                , \"medium\", \"high\", \"critical\" (default: \"medium\")\n     \
                \       Or use numbers: 1=Very Low, 2=Low, 3=Medium, 4=High, 5=Very\
                \ High\n    priority: Overall priority (auto-calculated if not set).\
                \ Options: \"low\", \"medium\", \"high\", \"critical\"\n         \
                \     Or use numbers: 1=Very Low, 2=Low, 3=Medium, 4=High, 5=Very\
                \ High\n    \n    # \U0001F195 NEW TICKET FIELDS\n    ticket_type:\
                \ Ticket type (1=Incident, 2=Request, default: 1)\n    status: Initial\
                \ ticket status (1=New, 2=Processing, etc., default: 1)\n    duration_minutes:\
                \ Estimated time in minutes for entire ticket (similar to task duration)\n\
                \    creation_date: Ticket creation date in ISO format (defaults to\
                \ current time)\n    takeintoaccountdate: Take into account date in\
                \ ISO format (defaults to creation_date)\n              \n    document_type:\
                \ Type of document for Vietnamese workflow. Options:\n           \
                \       \"contract\" (7 days due), \"proposal\" (5 days), \"report\"\
                \ (3 days), \n                  \"request\" (3 days), \"approval\"\
                \ (2 days), \"other\" (3 days)\n    due_in_days: Number of days until\
                \ due (auto-calculated based on document_type if not set)\n    \n\
                \    # \U0001F527 ADVANCED FIELDS (auto-configured for Vietnamese\
                \ workflow)\n    requesttypes_id: Request type ID (default: 1 for\
                \ standard requests)\n    \n    # \U0001F465 USER ASSIGNMENT (simplified\
                \ - most common patterns)\n    requester_user_ids: List of requester\
                \ user IDs (who requested this)\n    assigned_user_ids: List of assigned\
                \ user IDs (who should handle this)\n    assigned_group_ids: List\
                \ of assigned group IDs (which groups should handle this)\n    \n\
                \    # \U0001F465 LESS COMMON ASSIGNMENTS (moved to end)\n    observer_user_ids:\
                \ List of observer user IDs (who should be notified)\n    requester_group_ids:\
                \ List of requester group IDs (requesting groups)\n    observer_group_ids:\
                \ List of observer group IDs (groups to be notified)\n    \n    #\
                \ \U0001F4C5 DATE FIELDS\n    due_date: Due date in ISO format (YYYY-MM-DD\
                \ or YYYY-MM-DDTHH:MM:SS) - overrides due_in_days\n    \nReturns:\n\
                \    TicketResponse: The created ticket information with assigned\
                \ ID\n    \nExamples:\n    Simple document approval:\n    create_new_ticket(\n\
                \        name=\"TỜ TRÌNH SỐ 27.2025.TT-CNTT\",\n        content=\"\
                Tài liệu trình phê duyệt từ Phòng IT\",\n        document_type=\"\
                proposal\",\n        urgency=\"medium\"\n    )\n    \n    High-priority\
                \ contract:\n    create_new_ticket(\n        name=\"HỢP ĐỒNG SỐ 2025-HD-001\"\
                ,\n        content=\"Hợp đồng mua sắm thiết bị IT\",\n        document_type=\"\
                contract\",\n        urgency=\"high\",\n        assigned_user_ids=[2,\
                \ 5]\n    )"
              tool_label: create_new_ticket
              tool_name: create_new_ticket
              type: mcp
            - enabled: true
              extra:
                description: "Create a new task inside a GLPI ticket - for Vietnamese\
                  \ document workflow implementation.\n\n✨ AGENT-FRIENDLY: This tool\
                  \ creates tasks for approved documents requiring execution.\n\n\
                  Args:\n    tickets_id: ID of the ticket to add the task to (required)\
                  \ - can be string or number\n    content: Task description/instructions\
                  \ (required) - detailed description of what needs to be done\n \
                  \   \n    # \U0001F465 ASSIGNMENT\n    users_id_tech: Technician\
                  \ user ID (optional) – GLPI-specific assignment field\n    groups_id_tech:\
                  \ Technician group ID (optional)\n\n    # ⏱️ TIME MANAGEMENT  \n\
                  \    duration_minutes: Estimated duration in minutes – e.g., \"\
                  30\" = 30 min, \"240\" = 4 h\n    state: Task state. Options: \"\
                  todo\", \"done\" or \"1\", \"2\" (default: \"todo\")\n    \n   \
                  \ # \U0001F4C5 SCHEDULING\n    date: Task main date (optional, defaults\
                  \ to now if not provided) – accepts ISO (\"2024-08-08T09:00:00\"\
                  ) or \"YYYY-MM-DD HH:MM:SS\"\n    date_begin: Task start date-time\
                  \ \"YYYY-MM-DD HH:MM:SS\" (24-h) (optional)\n    date_end: Task\
                  \ end date-time   \"YYYY-MM-DD HH:MM:SS\" (optional)\n        Note:\
                  \ GLPI ignores pure dates without a time component.\n\n    # \U0001F3F7\
                  ️ CATEGORIZATION & PRIVACY\n    taskcategories_id: Task category\
                  \ ID (optional)\n    task_category: ITIL category ID for the task\
                  \ (optional) - dropdown field mapped to searchOption \"7\"\n   \
                  \ is_private: Whether the task is private (optional). Boolean: True/False\n\
                  \    tasktemplates_id: Task template ID (optional)\n    \nReturns:\n\
                  \    TicketTaskResponse: The created task information with assigned\
                  \ ID\n    \nExamples:\n    Create a simple task:\n    create_ticket_task(\n\
                  \        tickets_id=\"14\",\n        content=\"Review and implement\
                  \ the approved IT proposal\",\n        duration_minutes=\"240\"\
                  \  # 4 hours\n    )\n    \n    Create a scheduled task with deadline:\n\
                  \    create_ticket_task(\n        tickets_id=\"20\",\n        content=\"\
                  Prepare monthly report as requested by leadership\",\n        duration_minutes=\"\
                  120\",  # 2 hours\n        date_begin=\"2024-08-08T09:00:00\",\n\
                  \        date_end=\"2024-08-08T17:00:00\"\n    )\n    \n    Create\
                  \ a task that's already done:\n    create_ticket_task(\n       \
                  \ tickets_id=\"15\",\n        content=\"Document uploaded and processed\"\
                  ,\n        state=\"done\"\n    )\n    \n    Create a task with ITIL\
                  \ category:\n    create_ticket_task(\n        tickets_id=\"25\"\
                  ,\n        content=\"Implement security patches as per policy\"\
                  ,\n        task_category=\"7\"  # ITIL category ID from searchOption\
                  \ \"7\"\n    )"
