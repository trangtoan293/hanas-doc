              tool_description: Documents Retrieval Tool for Agent in Chatbot
              tool_label: Document Retrieval
              tool_name: docs_retriever
              type: workflow
            - enabled: true
              extra:
                description: "Get detailed information about any GLPI item with automatically\
                  \ fetched linked data.\n\nThis tool can retrieve any type of GLPI\
                  \ item (Ticket, Computer, User, etc.) and\nautomatically fetch all\
                  \ related items based on the item's links. It categorizes\nlinks\
                  \ into direct references (single entities) and collections (lists\
                  \ of items).\n\nArgs:\n    item_type: Type of GLPI item (e.g., 'Ticket',\
                  \ 'Computer', 'User', 'Group')\n    item_id: Unique identifier of\
                  \ the item\n    fetch_linked_data: Whether to automatically fetch\
                  \ linked items (default: True)\n    max_depth: Maximum depth for\
                  \ recursive link fetching (default: 2, automatically limited to\
                  \ max 3)\n    include_links_reference: Whether to include top-level\
                  \ links array for reference (default: False - redundant with linked_data)\n\
                  \    \nReturns:\n    ItemResponse: Complete item information with\
                  \ linked data organized by relationship type\n    Note: For tickets,\
                  \ numeric codes are returned (status, urgency, impact, priority).\
                  \ \n          See search_glpi_tickets tool documentation for code\
