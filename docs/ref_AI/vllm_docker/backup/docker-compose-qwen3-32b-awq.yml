version: '3.8'

services:
  vllm-qwen3-32b-awq:
    build:
      context: .
      dockerfile: Dockerfile
    image: ktl-vllm:latest
    container_name: vllm-qwen3-32b-awq  
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2 # Số lượng GPU bạn muốn sử dụng
              capabilities: [gpu]
    ports:
      - "8010:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - MODEL=Qwen/Qwen3-32B-AWQ # Thay bằng model bạn muốn sử dụng
      - TENSOR_PARALLEL_SIZE=2  # Số GPU đơn vị parallel
      - MAX_MODEL_LEN=32768  # Độ dài context tối đa
      - MAX_NUM_SEQS=16 # Số lượng sequences tối đa
      - QUANTIZATION=  # Để trống nếu không dùng quantization, hoặc dùng "awq", "gptq", "sq"
      - GPU_MEMORY_UTILIZATION=0.7  # Tỉ lệ sử dụng GPU memory (0.0-1.0)
      - TRUST_REMOTE_CODE=True
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    restart: always  # Đảm bảo luôn restart nếu container gặp sự cố
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s  # Thời gian để container khởi động hoàn toàn

  rerank-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rerank-service
    ports:
      - "8009:8009"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONPATH=/app
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  vllm-reranker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ktl-vllm:latest
    container_name: vllm-reranker
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2 # Số lượng GPU bạn muốn sử dụng
              capabilities: [gpu]
    ports:
      - "8008:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - MODEL=BAAI/bge-reranker-v2-m3 # Thay bằng rerank model bạn muốn sử dụng
      - TASK=score # Quan trọng: Đặt task là "score" cho reranking
      - TENSOR_PARALLEL_SIZE=2  # Số GPU đơn vị parallel
      - MAX_MODEL_LEN=8192  # Độ dài context tối đa - giảm xuống cho rerank model
      - MAX_NUM_SEQS=32  # Tăng số lượng sequences cho reranking batch
      - QUANTIZATION= # Để trống nếu không dùng quantization, hoặc dùng "awq", "gptq", "sq"
      - GPU_MEMORY_UTILIZATION=0.05  # Tỉ lệ sử dụng GPU memory (0.0-1.0)
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    restart: always  # Đảm bảo luôn restart nếu container gặp sự cố
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s  # Thời gian để container khởi động hoàn toàn. 

    