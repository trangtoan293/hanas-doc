version: '3.8'

services:
  vllm-qwen:
    build:
      context: .
      dockerfile: Dockerfile
    image: ktl-vllm:latest
    container_name: qwen25-vl-7b-inst
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2 # Số lượng GPU bạn muốn sử dụng
              capabilities: [gpu]
    ports:
      - "9000:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - MODEL=Qwen/Qwen2.5-VL-7B-Instruct # Thay bằng model bạn muốn sử dụng
      - TENSOR_PARALLEL_SIZE=2  # Số GPU đơn vị parallel
      - MAX_NUM_SEQS=16  # Số lượng sequences tối đa trong batch
      - QUANTIZATION=  # Để trống nếu không dùng quantization, hoặc dùng "awq", "gptq", "sq"
      - GPU_MEMORY_UTILIZATION=0.8 # Tỉ lệ sử dụng GPU memory (0.0-1.0)
      - TOOL_CALL_PARSER=hermes
      - TRUST_REMOTE_CODE=True
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    restart: always  # Đảm bảo luôn restart nếu container gặp sự cố
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Thời gian để container khởi động hoàn toàn
    command: --limit-mm-per-prompt image=5
    