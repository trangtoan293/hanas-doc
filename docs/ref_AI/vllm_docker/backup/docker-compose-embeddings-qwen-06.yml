version: '3.8'

services:
  vllm-embeddings-qwen3-06b:
    build:
      context: .
      dockerfile: Dockerfile
    image: ktl-vllm:latest
    container_name: vllm-embeddings-qwen3-06b
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 # Số lượng GPU bạn muốn sử dụng
              capabilities: [gpu]
    ports:
      - "8017:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - MODEL=Qwen/Qwen3-Embedding-0.6B # Thay bằng rerank model bạn muốn sử dụng
      - TASK=embeddings # Quan trọng: Đặt task là "embeddings" cho embedding
      - TENSOR_PARALLEL_SIZE=1  # Số GPU đơn vị parallel
      - MAX_MODEL_LEN=1024  # Độ dài context tối đa
      - MAX_NUM_SEQS=64  # Tăng số lượng sequences cho reranking batch
      - QUANTIZATION= # Để trống nếu không dùng quantization, hoặc dùng "awq", "gptq", "sq"
      - GPU_MEMORY_UTILIZATION=0.1  # Tỉ lệ sử dụng GPU memory (0.0-1.0)
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    restart: always  # Đảm bảo luôn restart nếu container gặp sự cố
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s  # Thời gian để container khởi động hoàn toàn