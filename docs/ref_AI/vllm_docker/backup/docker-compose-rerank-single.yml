version: '3.8'

services:
  vllm-reranker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ktl-vllm:latest
    container_name: vllm-reranker
    runtime: nvidia
    ports:
      - "8008:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - MODEL=BAAI/bge-reranker-v2-m3 # Thay bằng rerank model bạn muốn sử dụng
      - TASK=score # Quan trọng: Đặt task là "score" cho reranking
      - CUDA_VISIBLE_DEVICES=0  # Chỉ định GPU sử dụng (0,1 cho 2 GPU)
      - MAX_MODEL_LEN=8192  # Độ dài context tối đa - giảm xuống cho rerank model
      - MAX_NUM_SEQS=32  # Tăng số lượng sequences cho reranking batch
      - QUANTIZATION= # Để trống nếu không dùng quantization, hoặc dùng "awq", "gptq", "sq"
      - GPU_MEMORY_UTILIZATION=0.1  # Tỉ lệ sử dụng GPU memory (0.0-1.0)
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    restart: always  # Đảm bảo luôn restart nếu container gặp sự cố
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s  # Thời gian để container khởi động hoàn toàn