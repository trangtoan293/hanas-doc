version: '3.8'

services:
  vllm-qwen3-14b-awq-large-context:
    build:
      context: .
      dockerfile: Dockerfile
    image: ktl-vllm:latest
    container_name: vllm-qwen3-14b-awq-large-context
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8013:8000"
    volumes:
      - /ephemeral/data/.cache/huggingface:/root/.cache/huggingface
    environment:
      - MODEL=Qwen/Qwen3-14B-AWQ
      - TENSOR_PARALLEL_SIZE=1
      - MAX_MODEL_LEN=24576  # 24K context cho prompt rất lớn
      - MAX_NUM_SEQS=8  # Thấp hơn để tiết kiệm VRAM
      - GPU_MEMORY_UTILIZATION=0.45  # Thận trọng với VRAM
      - TRUST_REMOTE_CODE=True
      - KV_CACHE_DTYPE=fp8  # FP8 KV cache
      - ENFORCE_EAGER=true  # Disable CUDA graphs
      - MAX_NUM_BATCHED_TOKENS=4096  # Giảm để tránh OOM
      - BLOCK_SIZE=16  # Smaller block size
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s