version: '3.8'

services:

  vllm-qwen3-14b-awq:
    build:
      context: .
      dockerfile: Dockerfile
    image: ktl-vllm:latest
    container_name: vllm-qwen3-14b-awq
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 # Số lượng GPU bạn muốn sử dụng
              capabilities: [gpu]
    ports:
      - "8010:8000"
    volumes:
      - /ephemeral/data/.cache/huggingface:/root/.cache/huggingface
    environment:
      - MODEL=Qwen/Qwen3-14B-AWQ # Dùng model nhỏ hơn
      - TENSOR_PARALLEL_SIZE=1  # Số GPU đơn vị parallel
      - MAX_MODEL_LEN=32786  # Giảm context length
      - MAX_NUM_SEQS=16 # Tăng số lượng sequences
      - GPU_MEMORY_UTILIZATION=0.6 # Giảm memory usage
      - TRUST_REMOTE_CODE=True
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    restart: always  # Đảm bảo luôn restart nếu container gặp sự cố
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s  # Thời gian để container khởi động hoàn toàn

  vllm-embeddings-bge-m3:
    build:
      context: .
      dockerfile: Dockerfile
    image: ktl-vllm:latest
    container_name: vllm-embeddings-bge-m3
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 # Số lượng GPU bạn muốn sử dụng
              capabilities: [gpu]
    ports:
      - "8017:8000"
    volumes:
      - /ephemeral/data/.cache/huggingface:/root/.cache/huggingface
    environment:
      - VLLM_ENABLE_V1_MULTIPROCESSING=0
      - MODEL=BAAI/bge-m3 # Thay bằng rerank model bạn muốn sử dụng
      - TASK=embeddings # Quan trọng: Đặt task là "embeddings" cho embedding
      - TENSOR_PARALLEL_SIZE=1  # Số GPU đơn vị parallel
      - MAX_MODEL_LEN=1024  # Độ dài context tối đa
      - MAX_NUM_SEQS=64  # Tăng số lượng sequences cho reranking batch
      - QUANTIZATION= # Để trống nếu không dùng quantization, hoặc dùng "awq", "gptq", "sq"
      - GPU_MEMORY_UTILIZATION=0.15  # Tỉ lệ sử dụng GPU memory (0.0-1.0)
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    restart: always  # Đảm bảo luôn restart nếu container gặp sự cố
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s  # Thời gian để container khởi động hoàn toàn

  vllm-reranker-bge-m3:
    build:
      context: .
      dockerfile: Dockerfile
    image: ktl-vllm:latest
    container_name: vllm-reranker-bge-m3
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 # Số lượng GPU bạn muốn sử dụng
              capabilities: [gpu]
    ports:
      - "8018:8000"
    volumes:
      - /ephemeral/data/.cache/huggingface:/root/.cache/huggingface
    environment:
      - VLLM_ENABLE_V1_MULTIPROCESSING=0
      - MODEL=BAAI/bge-reranker-v2-m3 # Thay bằng rerank model bạn muốn sử dụng
      - TASK=score # Quan trọng: Đặt task là "score" cho reranking
      - MAX_MODEL_LEN=1024  # Độ dài context tối đa - giảm xuống cho rerank model
      - MAX_NUM_SEQS=64  # Tăng số lượng sequences cho reranking batch
      - GPU_MEMORY_UTILIZATION=0.15  # Tỉ lệ sử dụng GPU memory (0.0-1.0)
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    restart: always  # Đảm bảo luôn restart nếu container gặp sự cố
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s  # Thời gian để container khởi động hoàn toàn