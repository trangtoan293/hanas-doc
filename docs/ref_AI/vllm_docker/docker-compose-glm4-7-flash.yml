version: '3.8'

services:
  vllm-glm4-7-flash:
    build:
      context: .
      dockerfile: Dockerfile
    image: ktl-vllm:latest
    container_name: glm4-7-flash
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 # Số lượng GPU bạn muốn sử dụng
              capabilities: [gpu]
    ports:
      - "8018:8000"
    volumes:
      - /ephemeral/data/.cache/huggingface:/root/.cache/huggingface
    environment:
      - MODEL=cyankiwi/GLM-4.7-Flash-AWQ-4bit # Thay bằng model bạn muốn sử dụng
      - TENSOR_PARALLEL_SIZE=1  # Số GPU đơn vị parallel
      - MAX_MODEL_LEN=65536
      - MAX_NUM_SEQS=8  # Số lượng sequences tối đa trong batch
      - QUANTIZATION=  # Để trống nếu không dùng quantization, hoặc dùng "awq", "gptq", "sq"
      - GPU_MEMORY_UTILIZATION=0.3 # Tỉ lệ sử dụng GPU memory (0.0-1.0)
      - FLASHINFER_DISABLE_VERSION_CHECK=1  # Bypass flashinfer version mismatch

    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    restart: always  # Đảm bảo luôn restart nếu container gặp sự cố
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Thời gian để container khởi động hoàn toàn
    command: [
      "--limit-mm-per-prompt", "{\"image\": 5}",
      "--tool-call-parser", "glm47",
      "--reasoning-parser", "glm45"
    ]