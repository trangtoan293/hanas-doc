services:
  llama-qwen3-coder:
    # ============================================
    # Sử dụng official llama.cpp Docker image với CUDA
    # Ref: https://github.com/ggml-org/llama.cpp/blob/master/docs/docker.md
    # ============================================
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: qwen3-coder-next
    
    # NVIDIA GPU support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    ports:
      - "8010:8080"
    
    volumes:
      # Cache cho HuggingFace models
      - /ephemeral/data/.cache/huggingface:/root/.cache/huggingface
      # Cache cho llama.cpp models (quan trọng!)
      - /ephemeral/data/.cache/llama.cpp:/root/.cache/llama.cpp
      # Mount thư mục models nếu download riêng
      - /ephemeral/data/models:/models
    
    # ============================================
    # Qwen3-Coder-Next GGUF Q4_K_M Configuration
    # ============================================
    # llama-server command line arguments
    # Ref: https://github.com/ggml-org/llama.cpp/blob/master/tools/server
    # ============================================
    command:
      - "--hf-repo"
      - "Qwen/Qwen3-Coder-Next-GGUF"
      - "--hf-file"
      - "Qwen3-Coder-Next-Q4_K_M/Qwen3-Coder-Next-Q4_K_M-00001-of-00004.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "262144"
      - "-ngl"
      - "80"
      - "-b"
      - "2048"
      - "-ub"
      - "512"
      - "--parallel"
      - "2"
      - "--flash-attn"
      - "on"
      - "--split-mode"
      - "row"
      - "--temp"
      - "0.7"
      - "--top-k"
      - "40"
      - "--top-p"
      - "0.95"
      - "--min-p"
      - "0.05"
      - "--jinja"
      - "--metrics"
      - "--rope-scaling"
      - "yarn"
      - "--rope-scale"
      - "4"
      - "--yarn-orig-ctx"
      - "262144"

    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s  # Model download + load có thể mất 5 phút

# ============================================
# Command Line Options Explained:
# ============================================
# --hf-repo      : HuggingFace repository (auto-download)
# --hf-file      : Specific GGUF file trong repo
# -c             : Context length (32768 default, max 262144)
# -ngl           : GPU layers (99 = all layers on GPU)
# -b             : Batch size cho prompt processing
# -ub            : Micro batch size
# --parallel     : Số requests xử lý song song
# --flash-attn   : Flash Attention (on|off|auto)
# --split-mode   : row (tốt cho single GPU)
# --jinja        : Enable Jinja template cho chat
# --metrics      : Enable Prometheus metrics endpoint
# ============================================

# ============================================
# Các quantization options khác (thay đổi --hf-file):
# Files nằm trong subfolder, format: {quant}/{quant}-0000X-of-0000Y.gguf
# ============================================
# Q8_0: Chất lượng cao nhất (~80GB VRAM)
#   Qwen3-Coder-Next-Q8_0/Qwen3-Coder-Next-Q8_0-00001-of-00005.gguf
#
# Q5_K_M: Cân bằng tốt (~50GB VRAM)
#   Qwen3-Coder-Next-Q5_K_M/Qwen3-Coder-Next-Q5_K_M-00001-of-00004.gguf
#
# Q4_K_M: Recommended cho 80GB GPU (~40GB VRAM)
#   Qwen3-Coder-Next-Q4_K_M/Qwen3-Coder-Next-Q4_K_M-00001-of-00004.gguf
#
# Q3_K_M: Nhẹ hơn (~30GB VRAM)
#   Qwen3-Coder-Next-Q3_K_M/Qwen3-Coder-Next-Q3_K_M-00001-of-00003.gguf
# ============================================
