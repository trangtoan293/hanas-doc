version: '3.8'

services:
  vllm-qwen3-4b-2507:
    build:
      context: .
      dockerfile: Dockerfile
    image: ktl-vllm:latest
    container_name: vllm-qwen3-4b-2507
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8011:8000"
    volumes:
      - /ephemeral/data/.cache/huggingface:/root/.cache/huggingface
    environment:
      - MODEL=Qwen/Qwen3-4B-Instruct-2507
      - TENSOR_PARALLEL_SIZE=1
      - MAX_MODEL_LEN=16384  # Optimized: 8K instead of 32K
      - MAX_NUM_SEQS=32  # Increased for better throughput
      - GPU_MEMORY_UTILIZATION=0.4  # Higher utilization
      - TRUST_REMOTE_CODE=True
      - KV_CACHE_DTYPE=fp8  # Use FP16 for KV cache (saves memory)
      - ENFORCE_EAGER=true  # Disable CUDA graphs to save memory
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Faster startup with smaller context