# Backfill ETL Configuration v2
# Delete + Incremental approach (NOT full refresh)

# Backfill parameters
backfill:
  start_date: "2025-02-10"        # Ngày bắt đầu backfill
  end_date: "2025-02-16"          # Ngày kết thúc backfill (inclusive)
  branch_name_prefix: "backfill"   # → backfill_20250210_20250216

# Fix scripts location
fix_scripts:
  path: "sql/fix_data.sql"

# Notification settings
notification:
  enabled: false

# Catalog configuration
catalog:
  name: "LakeHouse"

# Tables to create branches
target_tables:
  raw_vault:
    schema: "integration"
    tables:
      # Hubs
      - hub_gl
      - hub_customer
      - hub_card
      - hub_branch
      # Satellites (history)
      - sat_gl
      - sat_branch
      - sat_customer
      - sat_card
      # Satellites (snapshot)
      - sat_snp_gl
      - sat_snp_branch
      - sat_snp_customer
      - sat_snp_card
      - sat_snp_gl_sbv
      - sat_gl_sbv
      # Satellites (derivative)
      - sat_der_gl
      - sat_der_branch
      - sat_der_customer
      - sat_der_card
      - sat_der_gl_sbv
      # Links
      - lnk_branch_gl
      - lnk_branch_parent
  
  data_mart:
    schema: "data_mart"
    tables:
      - dim_branch
      - fact_dp_detail
      - fact_dp_summary
      - fact_ln_detail
      - fact_ln_summary
      - fact_pl_detail
      - fact_pl_summary
    exclude_patterns:
      - "fact_*_backdate"
      - "dim_time"
      - "dim_pl_item"

# dbt configuration - NO full_refresh
dbt:
  raw_vault:
    select: "tag:hub tag:sat tag:sat_der tag:lnk"
    full_refresh: false
  
  data_mart_dim:
    select: "dim_branch"
    full_refresh: false
  
  data_mart_fact:
    select: "tag:fact"
    exclude: "tag:backdate"
    full_refresh: false

# Spark job configuration
spark:
  namespace: "spark-jobs"
  kubernetes_conn_id: "k8s_conn_id"
  driver_cores: 3
  driver_memory: "4g"
  executor_cores: 3
  executor_memory: "4g"
  executor_instances: 2
