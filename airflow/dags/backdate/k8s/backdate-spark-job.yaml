apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: backdate-table-creation
  namespace: spark-jobs
  labels:
    app: backdate-etl
    component: table-creation
spec:
  type: Python
  mode: cluster
  image: "trangtoan293/dbt-spark-k8s-ktl:ktl-dbt"
  imagePullPolicy: IfNotPresent
  mainApplicationFile: "local:///opt/spark/work-dir/dbt-project/spark_code/spark_sql_runner.py"
  arguments:
    - "--sql-text"
    - "DROP TABLE IF EXISTS LakeHouse.landing.gl_poc_backdate; CREATE TABLE LakeHouse.landing.gl_poc_backdate USING iceberg AS SELECT EOD_DATE, CAST(EOD_DATE - INTERVAL 5 DAYS AS TIMESTAMP) as value_date, POS_CD, AC_NO, case when DR_CR_FLG = 'D' then 'C' else 'D' end as DR_CR_FLG,     LCY_AMT * NUM_DUPLICATES as LCY_AMT, FCY_AMT * NUM_DUPLICATES as FCY_AMT FROM LakeHouse.landing.gl_poc_streaming WHERE EOD_DATE BETWEEN date'{{ params.start_date }}' AND date'{{ params.end_date }}'"

  sparkVersion: "3.5.1"

  sparkConf:
    "spark.sql.adaptive.enabled": "true"
    "spark.sql.adaptive.coalescePartitions.enabled": "true"
    "spark.serializer": "org.apache.spark.serializer.KryoSerializer"
    "spark.sql.legacy.timeParserPolicy": "LEGACY"

    # Hive Metastore & Warehouse
    "spark.hadoop.hive.metastore.uris": "thrift://192.168.1.156:9083"
    "spark.hadoop.hive.metastore.client.socket.timeout": "1800"
    "spark.sql.warehouse.dir": "s3a://data/warehouse/"

    # S3/MinIO
    "spark.hadoop.fs.s3a.endpoint": "http://192.168.1.151"
    "spark.hadoop.fs.s3a.path.style.access": "true"
    "spark.hadoop.fs.s3a.ssl.enabled": "false"
    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider"
    "spark.hadoop.fs.s3a.access.key": "Vl21ZDUEq1XNiDDN"
    "spark.hadoop.fs.s3a.secret.key": "Su9omOppqPvl9q59ABdIfzwOzDi1PpgZ"
    "spark.hadoop.fs.s3a.aws.region": "us-east-1"

    # Iceberg
    "spark.sql.extensions": "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
    "spark.sql.catalog.spark_catalog": "org.apache.iceberg.spark.SparkSessionCatalog"
    "spark.sql.catalog.spark_catalog.type": "hive"

    # Kubernetes
    "spark.kubernetes.namespace": "spark-jobs"
    "spark.kubernetes.authenticate.driver.serviceAccountName": "spark"
    "spark.kubernetes.authenticate.executor.serviceAccountName": "spark"
    "spark.kubernetes.client.timeout": "30000"

    # LakeHouse Catalog
    "spark.sql.catalog.LakeHouse": "org.apache.iceberg.spark.SparkCatalog"
    "spark.sql.catalog.LakeHouse.type": "hive"
    "spark.sql.catalog.LakeHouse.uri": "thrift://192.168.1.156:9083"
    "spark.sql.catalog.LakeHouse.io-impl": "org.apache.iceberg.aws.s3.S3FileIO"
    "spark.sql.catalog.LakeHouse.s3.endpoint": "http://192.168.1.151"
    "spark.sql.catalog.LakeHouse.warehouse": "s3a://data/warehouse/"
    
    "spark.sql.defaultCatalog": "LakeHouse"

  driver:
    cores: {{ dag_run.conf.get('backdate_sql_driver_cores', params.backdate_sql_driver_cores) | int }}
    memory: "{{ dag_run.conf.get('backdate_sql_driver_memory', params.backdate_sql_driver_memory) }}"
    serviceAccount: spark

    # git-sync init container to pull the repository
    initContainers:
      - name: git-sync
        image: registry.k8s.io/git-sync/git-sync:v4.1.0
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
        envFrom:
          - configMapRef:
              name: git-sync-config
              optional: false
        volumeMounts:
          - name: dbt-project
            mountPath: /opt/spark/work-dir
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"

    envFrom:
      - secretRef:
          name: spark-k8s-aws-credentials
      - configMapRef:
          name: spark-k8s-config

    volumeMounts:
      - name: dbt-project
        mountPath: /opt/spark/work-dir

    labels:
      component: spark-driver

  executor:
    cores: {{ dag_run.conf.get('backdate_sql_executor_cores', params.backdate_sql_executor_cores) | int }}
    memory: "{{ dag_run.conf.get('backdate_sql_executor_memory', params.backdate_sql_executor_memory) }}"
    instances: {{ dag_run.conf.get('backdate_sql_executor_instances', params.backdate_sql_executor_instances) | int }}
    
    envFrom:
      - secretRef:
          name: spark-k8s-aws-credentials
      - configMapRef:
          name: spark-k8s-config

    volumeMounts:
      - name: dbt-project
        mountPath: /opt/spark/work-dir

    labels:
      component: spark-executor

  volumes:
    - name: dbt-project
      emptyDir: {}

  restartPolicy:
    type: OnFailure
    onFailureRetries: 2
    onFailureRetryInterval: 10
    onSubmissionFailureRetries: 3
    onSubmissionFailureRetryInterval: 20
