# Backdate ETL Configuration
# This file contains parameters for the backdate data flow

# Date range for backdate processing
date_range:
  start_date: "2025-02-10"
  end_date: "2025-02-15"

# Table configuration
backdate_table:
  catalog: "LakeHouse"
  schema: "landing"
  table_name: "gl_poc_backdate"
  format: "iceberg"

# Source table
source_table:
  catalog: "LakeHouse"
  schema: "landing"
  table_name: "gl_poc_streaming"

# Views to create in Dremio
views:
  - name: "FACT_PL_DETAIL_BACKDATE"
    sql_file: "FACT_PL_DETAIL_BACKDATE.sql"
  - name: "FACT_PL_SUMMARY_BACKDATE"
    sql_file: "FACT_PL_SUMMARY_BACKDATE.sql"
  - name: "FACT_DP_DETAIL_BACKDATE"
    sql_file: "FACT_DP_DETAIL_BACKDATE.sql"
  - name: "FACT_DP_SUMMARY_BACKDATE"
    sql_file: "FACT_DP_SUMMARY_BACKDATE.sql"
  - name: "FACT_LN_DETAIL_BACKDATE"
    sql_file: "FACT_LN_DETAIL_BACKDATE.sql"
  - name: "FACT_LN_SUMMARY_BACKDATE"
    sql_file: "FACT_LN_SUMMARY_BACKDATE.sql"


# Reflection configuration
reflection:
  type: "raw"
  display_columns: "all"
  strategy: "minimize_refresh_time"

# Spark job configuration
spark:
  namespace: "spark-jobs"
  kubernetes_conn_id: "k8s_conn_id"
  driver_cores: 3
  driver_memory: "6g"
  executor_cores: 3
  executor_memory: "4g"
  executor_instances: 3
