apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: dbt-run-rawvault
  namespace: spark-jobs
  labels:
    app: dbt-spark
    deployment: external-git-sidecar
spec:
  type: Python
  mode: cluster
  image: "trangtoan293/dbt-spark-k8s-ktl:ktl-dbt"
  imagePullPolicy: IfNotPresent
  mainApplicationFile: "local:///opt/spark/work-dir/dbt-project/dbt-project/dbt_runner.py"
  arguments: 
    - "--use-subprocess"
    - "--dbt-command"
    - "ktl_dbt"
    - "--upload-artifacts"
    - "--s3-bucket"
    - "data"
    - "--s3-prefix"
    - "{% set base_prefix = var.value.get('DBT_ARTIFACTS_PREFIX', None) %}{% if not base_prefix %}{% set base_prefix = 'dbt-artifacts/' ~ dag_run.run_id %}{% endif %}{% set suffix = params.get('artifacts_suffix') %}{{ base_prefix }}{% if suffix %}/{{ suffix }}{% endif %}"
    - "--s3-endpoint-url"
    - "http://192.168.1.151"
    - "run"
    - "--target"
    - "dev"
    {% include "dbt-runner-eod-vars.yaml" %}
    {% if params.full_refresh %}
    - "--full-refresh"
    {% endif %}
    {% if params.dbt_select %}
    - "--select"
    {% for tok in params.dbt_select.split(' ') if tok %}
    - "{{ tok }}"
    {% endfor %}
    {% endif %}


  sparkVersion: "3.5.1"

  sparkConf:
    # Optimizations
    "spark.sql.adaptive.enabled": "true"
    "spark.sql.adaptive.coalescePartitions.enabled": "true"
    "spark.serializer": "org.apache.spark.serializer.KryoSerializer"

    # Hive Metastore & Warehouse
    "spark.hadoop.hive.metastore.uris": "thrift://192.168.1.156:9083"
    "spark.sql.warehouse.dir": "s3a://data/warehouse/"

    # S3/MinIO (no credentials embedded)
    "spark.hadoop.fs.s3a.endpoint": "http://192.168.1.151"
    "spark.hadoop.fs.s3a.path.style.access": "true"
    "spark.hadoop.fs.s3a.ssl.enabled": "false"
    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider"
    "spark.hadoop.fs.s3a.access.key": "Vl21ZDUEq1XNiDDN"
    "spark.hadoop.fs.s3a.secret.key": "Su9omOppqPvl9q59ABdIfzwOzDi1PpgZ"
      #    "spark.hadoop.fs.s3a.aws.region": "us-east-1"

    # Iceberg
    "spark.sql.extensions": "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
    "spark.sql.catalog.spark_catalog": "org.apache.iceberg.spark.SparkSessionCatalog"
    "spark.sql.catalog.spark_catalog.type": "hive"
    "spark.sql.catalog.spark_catalog.lock-enabled": "false"
    "spark.sql.catalog.spark_catalog.lock-impl": "org.apache.iceberg.util.NoLockManager"
    # Datetime parsing compatibility for non-ISO formats (e.g. MM/dd/yyyy HH:mm:ss)
    "spark.sql.legacy.timeParserPolicy": "LEGACY"

    # Kubernetes
    "spark.kubernetes.namespace": "spark-jobs"
      # "spark.kubernetes.authenticate.driver.serviceAccountName": "spark"
      #"spark.kubernetes.authenticate.executor.serviceAccountName": "spark"
      #"spark.kubernetes.client.timeout": "30000"
 
    # Demo Catalog (Custom Iceberg)
    "spark.sql.catalog.demo": "org.apache.iceberg.spark.SparkCatalog"
    "spark.sql.catalog.demo.type": "hive"
    "spark.sql.catalog.demo.uri": "thrift://192.168.1.156:9083"
    "spark.sql.catalog.demo.io-impl": "org.apache.iceberg.aws.s3.S3FileIO"
    "spark.sql.catalog.demo.s3.endpoint": "http://192.168.1.151"
    "spark.sql.catalog.demo.warehouse": "s3a://data/warehouse/"
    "spark.sql.catalog.demo.metrics-reporter-impl": "org.apache.iceberg.metrics.LoggingMetricsReporter"
    "spark.sql.catalog.demo.lock-enabled": "false"
    "spark.sql.catalog.demo.lock-impl": "org.apache.iceberg.util.NoLockManager"
    
    # LakeHouse Catalog (for etladmin tables)
    "spark.sql.catalog.LakeHouse": "org.apache.iceberg.spark.SparkCatalog"
    "spark.sql.catalog.LakeHouse.type": "hive"
    "spark.sql.catalog.LakeHouse.uri": "thrift://192.168.1.156:9083"
    "spark.sql.catalog.LakeHouse.io-impl": "org.apache.iceberg.aws.s3.S3FileIO"
    "spark.sql.catalog.LakeHouse.s3.endpoint": "http://192.168.1.151"
    "spark.sql.catalog.LakeHouse.warehouse": "s3a://data/warehouse/"
    "spark.sql.catalog.LakeHouse.metrics-reporter-impl": "org.apache.iceberg.metrics.LoggingMetricsReporter"
    "spark.sql.catalog.LakeHouse.lock-enabled": "false"
    "spark.sql.catalog.LakeHouse.lock-impl": "org.apache.iceberg.util.NoLockManager"
    
    # Default Catalog
    "spark.sql.defaultCatalog": "demo"

  driver:
    cores: 3
    memory: "5g"
    serviceAccount: spark

    # Sidecar: git-sync keeps repo up-to-date (not just one-time)
    initContainers:
      - name: git-sync
        image: registry.k8s.io/git-sync/git-sync:v4.1.0
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
        envFrom:
          - configMapRef:
              name: git-sync-config
              optional: false
        volumeMounts:
          - name: dbt-project
            mountPath: /opt/spark/work-dir
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"

    env:
      - name: SCHEMA_NAME
        value: "integration"
        
    envFrom:
      - secretRef:
          name: spark-k8s-aws-credentials
      - secretRef:
          name: spark-k8s-oracle-credentials
      - secretRef:
          name: spark-k8s-mssql-credentials
      - configMapRef:
          name: spark-k8s-config

    volumeMounts:
      - name: dbt-project
        mountPath: /opt/spark/work-dir

    labels:
      component: spark-driver

  executor:
    cores: 3
    memory: "4g"
    instances: 2
    envFrom:
      - secretRef:
          name: spark-k8s-aws-credentials
      - secretRef:
          name: spark-k8s-oracle-credentials
      - secretRef:
          name: spark-k8s-mssql-credentials
      - configMapRef:
          name: spark-k8s-config
    
    env:
      - name: SCHEMA_NAME
        value: "integration"

    volumeMounts:
      - name: dbt-project
        mountPath: /opt/spark/work-dir
    labels:
      component: spark-executor

  volumes:
    - name: dbt-project
      emptyDir: {}

  restartPolicy:
    type: OnFailure
    onFailureRetries: 2
    onFailureRetryInterval: 10
    onSubmissionFailureRetries: 3
    onSubmissionFailureRetryInterval: 20
