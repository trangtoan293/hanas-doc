version: 2

models:
  - name: dim_branch_new
    description: |
      Dimension table for Branch (SCD Type 2).
      Built using the generic dim_scd2_transform macro.
    columns:
      - name: D_BRANCH_ID
        description: Surrogate Key (Hash of BRANCH_CODE + EFF_FR_DT)
        tests:
          - unique
          - not_null
      - name: BRANCH_CODE
        description: Business Key - Branch Code
        tests:
          - not_null
      - name: EFF_FR_DT
        description: Effective From Date
      - name: EFF_TO_DT
        description: Effective To Date (9999-12-31 for current record)
      - name: IN_USE_STATUS
        description: Active flag (1 = current, 0 = historical)
      - name: BRANCH_NAME
        description: Branch Name
      - name: PARENT_CODE
        description: Parent Branch Code
      - name: PARENT_NAME
        description: Parent Branch Name
      - name: KV_NAME
        description: Region Name (Khu Vực)
      - name: NBR_STAFF
        description: Number of Staff
      - name: LAST_MODIFY_TIME
        description: Last modification timestamp from source
